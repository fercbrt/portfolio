<app-section heading="Experience">
    @if (experienceResource.hasValue()) {
        <div class="flex flex-wrap gap-2 mb-6">
            <button appToggleChip   type="button" (click)="selectedTechnology.set(null)"
                [pressed]="selectedTechnology() === null">
                All
            </button>
            @for (item of allTechnologies(); track item) {
                <button appToggleChip type="button" (click)="selectedTechnology.set(item)"
                    [pressed]="selectedTechnology() === item">
                    {{ item }}
                </button>
            }
        </div>
        <ul>
            @for (item of filteredExperiences(); track item.id) {
                <li class="my-4">
                    <app-experience-card [experience]="item" />
                </li>
            } @empty {
                <li>
                    There is no experience.
                </li>
            }
        </ul>
    } @else if (experienceResource.isLoading()) {
        <p role="status" class="text-gray-500 text-sm">Loading experience...</p>
    } @else {
        <app-error-message (retry)="reload()" message="Could not load experience."/>
    }
</app-section>
