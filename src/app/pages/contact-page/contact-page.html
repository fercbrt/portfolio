<app-section heading="Contact">
    <form>
        <label for="name">
            Name
        </label>
        <input id="name" type="text" [formField]="contactForm.name" />
        <label for="email">
            Email
        </label>
        <input id="email" type="email" [formField]="contactForm.email" />
        <label for="message">
            Message
        </label>
        <textarea id="message" [formField]="contactForm.message"></textarea>
    </form>
    <p>
        {{ contactForm().value() | json }}
    </p>
</app-section>
