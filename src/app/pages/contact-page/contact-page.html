<app-section heading="Contact">
    <form [formRoot]="contactForm" class="space-y-5 max-w-xl" >
        <div class="space-y-2">
            <label for="name" class="block text-sm font-medium text-gray-700">
                Name
            </label>
            <input id="name" type="text"
                autocomplete="name"
                [formField]="contactForm.name"
                class="block w-full border border-gray-300 rounded-md px-3 py-2 bg-white text-gray-900 focus:outline-2 focus:outline-offset-0 focus:outline-gray-900 transition-colors aria-invalid:border-red-600 aria-invalid:focus:outline-red-600" 
                [aria-invalid]="contactForm.name().touched() && contactForm.name().invalid()"
                aria-describedby="name-errors" />
            <app-field-errors [field]="contactForm.name" errorsId="name-errors" />
        </div>
        <div class="space-y-2">
            <label for="email" class="block text-sm font-medium text-gray-700">
                Email
            </label>
            <input id="email" type="email" 
                autocomplete="email"
                [formField]="contactForm.email" 
                class="block w-full border border-gray-300 rounded-md px-3 py-2 bg-white text-gray-900 focus:outline-2 focus:outline-offset-0 focus:outline-gray-900 transition-colors aria-invalid:border-red-600 aria-invalid:focus:outline-red-600 "
                [aria-invalid]="contactForm.email().touched() && contactForm.email().invalid()"
                aria-describedby="email-errors" />
            <app-field-errors [field]="contactForm.email" errorsId="email-errors" />
        </div>
        <div class="space-y-2">
            <label for="message" class="block text-sm font-medium text-gray-700">
                Message
            </label>
            <textarea id="message" [formField]="contactForm.message"
            class="block w-full border border-gray-300 rounded-md px-3 py-2 bg-white text-gray-900 focus:outline-2 focus:outline-offset-0 focus:outline-gray-900 transition-colors resize-y aria-invalid:border-red-600 aria-invalid:focus:outline-red-600"
            [aria-invalid]="contactForm.message().touched() && contactForm.message().invalid()"
            rows="5" aria-describedby="message-errors" ></textarea>
            <app-field-errors [field]="contactForm.message" errorsId="message-errors" />
        </div>
        <button type="submit"
            [disabled]="contactForm().submitting()"
            class="rounded-md px-3 py-2 text-sm font-medium border cursor-pointer transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 
                bg-gray-900 text-white border-gray-900 enabled:hover:bg-gray-100 enabled:hover:text-gray-900 disabled:opacity-50 disabled:cursor-not-allowed">
            @if (contactForm().submitting()) {
                Sending...
            } @else {
                Submit
            }
        </button>
        @if (contactForm().errors().length > 0) {
            <app-error-message [message]="contactForm().errors()[0].message ?? ''" />
        }
        <p role="status" class="text-sm text-green-700 mt-2">
            @if (submitted()) {
                Thanks! Your message has been sent.
            }
        </p>
    </form>
</app-section>
