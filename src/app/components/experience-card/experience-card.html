<h3 class="font-bold my-2">
    <a [routerLink]="['/experience', experience().id]" class="text-blue-700 hover:text-blue-900 focus-visible:text-blue-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 rounded-sm transition-colors">
        {{ experience().position }}, {{ experience().company }}
    </a>
</h3>
<p>
    {{ experience().startDate | date: 'MMM y' }} – @if (experience().endDate) {
    {{ experience().endDate | date: 'MMM y' }}
    } @else {Present}
</p>
<p class="my-2">
    {{ experience().description }}
</p>
<app-experience-chips [technologies]="experience().technologies" />
