<h3 class="font-bold my-2">
    {{ experience().position }}, {{ experience().company }}
</h3>
<p>
    {{ experience().startDate | date: 'MMM y' }} – @if (experience().endDate) {
    {{ experience().endDate | date: 'MMM y' }}
    } @else {Present}
</p>
<p class="my-2">
    {{ experience().description }}
</p>
<div class="flex flex-wrap gap-2">
    @for (item of experience().technologies; track $index) {
        <div class="rounded-full px-2.5 py-0.5 text-xs font-medium border border-gray-200 bg-gray-100 text-gray-700">
            {{ item }}
        </div>
    }
</div>
