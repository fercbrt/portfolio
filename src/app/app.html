<div class="px-4 mx-auto max-w-4xl">
  <app-header [name]="name()" [role]="role()" />
  <main>
    <app-section heading="About Me">
      <p>
        I am a software engineer with a passion for creating innovative solutions and building user-friendly applications. Or that's what Copilot said in the VSCode suggestion before I disabled it.
      </p>
    </app-section>
    <app-section heading="Experience">
      <ul>
        @for (item of experiences; track item.id) {
          <li class="my-4">
            <app-experience-card [experience]="item" />
          </li>
        } @empty {
          <li>
            There is no experience.
          </li>
        }
      </ul>
    </app-section>
    <router-outlet />
  </main>
  <app-footer [ownerName]="name()" />  
</div>
